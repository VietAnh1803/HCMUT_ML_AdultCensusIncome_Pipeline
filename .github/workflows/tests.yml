name: Adult Income tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-improved.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-improved.txt
      - name: Run the complete suite
        run: python tools/run_tests.py --output .cache/ci_test_results.json
      - name: Verify all 50 cases and write the summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('.cache/ci_test_results.json').read_text())
          assert report['successful'] and report['tests_run'] == report['passed'] == 50
          assert report['failures'] == report['errors'] == report['skipped'] == 0
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('50/50 automated tests passed on Python 3.12, Linux, CPU.\n\n')
              summary.write('Cases include scoring CLI, data boundaries, early stopping and checkpoint weights.\n')
          PY
